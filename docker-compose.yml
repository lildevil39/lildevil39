services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nivora
      POSTGRES_PASSWORD: nivora
      POSTGRES_DB: nivora
    ports:
      # Host port 45432, not 5432 — this machine already runs several
      # native Postgres instances on 5432/5433/5434, and Windows periodically
      # reserves ephemeral ranges (check `netsh interface ipv4 show
      # excludedportrange protocol=tcp` if this ever fails to bind again).
      - "45432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nivora
      MINIO_ROOT_PASSWORD: nivora123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
